<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CinemaShare Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
    <script src="config.js"></script>
</head>
<body>
    <header class="navbar">
        <h1 class="logo">CinemaShare</h1>
        
        <div class="profile-menu">
            <button class="profile-button">👤</button>
            <div class="dropdown">
                <a href="#">Profile</a>
                <a href="#">Settings</a>
                <a href="index.html">Logout</a>
            </div>
        </div>
    </header>

    <div class="container">
        <h2>Dashboard</h2>
        <p>Welcome to your CinemaShare dashboard!</p>
        <p id="roleDisplay"></p>

        <div class="card">
            <h3>File Upload</h3>
            <input type="file" id="fileInput" />
            <button onclick="uploadFile()">Upload Screenplay</button>
            <button onclick="listFiles()">View Uploaded Files</button>
        </div>

        <div id="fileList" style="margin-top: 20px;"></div>
    </div>

<script>
let token = localStorage.getItem('access_token');

if (!token && window.location.protocol === 'file:') {
    console.warn("DEV MODE: Allowing local access");
    token = "dev-token";
    localStorage.setItem('access_token', token);
    localStorage.setItem('role', 'producer');
}

if (!token) {
    window.location.href = 'index.html';
}

const role = localStorage.getItem('role') || 'screenwriter';

function applyRBAC() {
    const uploadCard = document.querySelector('.card');
    const fileUploadTitle = uploadCard.querySelector('h3');

    if (role === 'actor') {
        uploadCard.style.display = 'none';
    }

    if (role === 'producer') {
        fileUploadTitle.textContent = 'Manage Scripts';
    }

    if (role === 'screenwriter') {
        fileUploadTitle.textContent = 'Upload Script';
    }
}

window.addEventListener('DOMContentLoaded', () => {
    applyRBAC();
    document.getElementById('roleDisplay').textContent = `Role: ${role}`;
});

// Dropdown menu
const profileButton = document.querySelector('.profile-button');
const dropdown = document.querySelector('.dropdown');

profileButton.addEventListener('click', () => {
    dropdown.classList.toggle('show');
});

window.addEventListener('click', (event) => {
    if (!event.target.matches('.profile-button')) {
        dropdown.classList.remove('show');
    }
});

// Logout
document.querySelector('.dropdown a[href="index.html"]').addEventListener('click', (e) => {
    e.preventDefault();
    localStorage.removeItem('access_token');
    window.location.href = 'index.html';
});

// Upload file (unchanged)
function uploadFile() {
    if (role === 'actor') {
        alert('Actors are not allowed to upload scripts.');
        return;
    }

    const file = document.getElementById('fileInput').files[0];
    if (!file) {
        alert('Select a file.');
        return;
    }

    const formData = new FormData();
    formData.append('file', file);

    fetch(window.API_CONFIG.API_URL + "/api/upload", {
        method: 'POST',
        body: formData,
        headers: {
            'Authorization': `Bearer ${token}`
        }
    })
    .then(res => res.json())
    .then(() => listFiles());
}

// List files (UPDATED to use screenplay_id)
function listFiles() {
    fetch(window.API_CONFIG.API_URL + "/api/uploads", {
        headers: {
            'Authorization': `Bearer ${token}`
        }
    })
    .then(res => res.json())
    .then(data => {
        const div = document.getElementById('fileList');

        if (!data.success || data.files.length === 0) {
            div.innerHTML = "<p>No files uploaded.</p>";
            return;
        }

        let html = "<h4>Screenplays:</h4><ul>";

        data.files.forEach(file => {
            html += `
                <li>
                    <strong>${file.filename}</strong>
                    <button onclick="downloadFiltered(${file.file_id}, '${file.filename}')">
                        Download
                    </button>
                </li>
            `;
        });

        html += "</ul>";
        div.innerHTML = html;
    });
}

// Download filtered (censored) screenplay
function downloadFiltered(screenplayId, filename) {
    const url = `${window.API_CONFIG.API_URL}/api/download_filtered/${screenplayId}`;
	console.log(screenplayId);
    fetch(url, {
        method: 'GET',
        headers: {
            'Authorization': `Bearer ${token}`
        }
    })
    .then(response => {
        if (!response.ok) throw new Error("Download failed");
        return response.blob();
    })
    .then(blob => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "filtered_" + filename.replace('.pdf', '.txt');
        a.click();
        URL.revokeObjectURL(a.href);
    })
    .catch(err => {
        console.error(err);
        alert("Failed to download filtered script.");
    });
}
</script>
</body>
</html>
