<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>CinemaShare Dashboard</title>
        <link rel="stylesheet" href="dashboard.css">
        <script src="config.js"></script>
        <script src="crypto.js"></script>
    </head>
    <body>
        <header class="navbar">
            <h1 class="logo">CinemaShare</h1>
            
            <div class="profile-menu">
                <button class="profile-button">👤</button>

                <div class="dropdown">
                    <a href="#">Profile</a>
                    <a href="#">Settings</a>
                    <a href="index.html">Logout</a>
                </div>
            </div>
        </header>

            <div class="container">
                <h2>Dashboard</h2>
                <p>Welcome to your CinemaShare dashboard!</p>
                <p id="roleDisplay"></p>

                <div class="card">
                    <h3>File Upload</h3>
                    <input type="file" id="fileInput" />
                    <button onclick="uploadFile()">Upload Screenplay</button>
                    <button onclick="listFiles()">View Uploaded Files</button>
                </div>
                
                <div class="file-row" onclick="openFile('script.pdf')">
                    <span class="file-name">script.pdf</span>
                    <span class="file-meta">200KB</span>
                </div>

                <div class="file-row" onclick="openFile('script2.pdf')">
                    <span class="file-name">script2.pdf</span>
                    <span class="file-meta">140KB</span>
                </div>

                <div id="fileList" style="margin-top: 20px;"></div>
            </div>

        <script>
            // Check if user is authenticated
            let token = localStorage.getItem('access_token');

            if (!token && window.location.protocol === 'file:') {
                console.warn("DEV MODE: Allowing local access");
                token = "dev-token";

                localStorage.setItem('access_token', token);
                localStorage.setItem('role', 'producer');
            }

            if (!token) {
                //Redirect to login if no token found
                window.location.href = 'index.html';
            }

            // Decode role from JWT
            function getRoleFromToken(t) {
                try { return JSON.parse(atob(t.split('.')[1])).role || 'viewer'; }
                catch { return 'viewer'; }
            }
            const role = getRoleFromToken(token);

            function applyRBAC() {
                const uploadCard = document.querySelector('.card');
                const fileUploadTitle = uploadCard.querySelector('h3');

                // Actors will NOT be allowed to upload files
                if (role === 'actor') {
                    uploadCard.style.display = 'none';
                }

                if (role === 'producer') {
                    fileUploadTitle.textContent = 'Manage Scripts';
                }

                if (role === 'screenwriter') {
                    fileUploadTitle.textContent = 'Upload Script';
                }
            }

        window.addEventListener('DOMContentLoaded', () => {
            applyRBAC();
            document.getElementById('roleDisplay').textContent = `Role ${role}`;
        });

            // Dropdown menu functionality
            const profileButton = document.querySelector('.profile-button');
            const dropdown = document.querySelector('.dropdown');

            profileButton.addEventListener('click', () => {
                dropdown.classList.toggle('show');
            });

            // Close the dropdown if the user clicks outside of it
            window.addEventListener('click', (event) => {
                if (!event.target.matches('.profile-button') && !event.target.matches('.profile-icon')) {
                    if (dropdown.classList.contains('show')) {
                        dropdown.classList.remove('show');
                    }
                }
            });

            // Handle logout
            const logoutLink = document.querySelector('.dropdown a[href="index.html"]');
            logoutLink.addEventListener('click', (event) => {
                event.preventDefault();
                // Clear the token
                localStorage.removeItem('access_token');
                // Redirect to login
                window.location.href = 'index.html';
            });

            // Handle file upload with AES-GCM encryption
           async function uploadFile() {
                if (role === 'actor') {
                    alert('Actors are not allowed to upload scripts.');
                    return;
                }

                const fileInput = document.getElementById('fileInput');
                const file = fileInput.files[0];
                if (!file) {
                    alert('Please select a file to upload.');
                    return;
                }

                const key = await CryptoUtils.loadKey();
                if (!key) {
                    alert('Encryption key not found. Please log in again.');
                    window.location.href = 'index.html';
                    return;
                }

                const encryptedBlob = await CryptoUtils.encryptFile(file, key);
                const encryptedFile = new File([encryptedBlob], file.name, { type: 'application/octet-stream' });

                const formData = new FormData();
                formData.append('file', encryptedFile);

                fetch(window.API_CONFIG.API_URL + "/api/upload", {
                    method: 'POST',
                    body: formData,
                    headers: { 'Authorization': `Bearer ${token}` }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('File uploaded and encrypted successfully!');
                        listFiles();
                    } else {
                        alert('Upload failed: ' + (data.detail || 'Unknown error'));
                    }
                })
                .catch(error => {
                    console.error('Error uploading file:', error);
                    alert('Failed to upload file.');
                });
           }

           // List all uploaded files
           function listFiles() {
                fetch(window.API_CONFIG.API_URL + "/api/uploads", {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                })
                .then(response => response.json())
                .then(data => {
                    const fileListDiv = document.getElementById('fileList');
                    if (data.success && data.files.length > 0) {
                        let html = '<h4>Uploaded Files (' + data.total + '):</h4><ul>';
                        data.files.forEach(file => {
                            const sizeKB = (file.size / 1024).toFixed(2);
                            const uploadedAt = file.uploaded_at ? new Date(file.uploaded_at).toLocaleString() : '';
                            html += `<li>
                                <strong>${file.filename}</strong> - ${sizeKB} KB (${uploadedAt})
                                <button onclick="downloadFile(${file.file_id}, '${file.filename}')" style="margin-left: 10px;">Download</button>
                                <button onclick="revokeFile(${file.file_id})" style="margin-left: 5px; color: red;">Revoke</button>
                            </li>`;
                        });
                        html += '</ul>';
                        fileListDiv.innerHTML = html;
                    } else {
                        fileListDiv.innerHTML = '<p>No files uploaded yet.</p>';
                    }
                })
                .catch(error => {
                    console.error('Error listing files:', error);
                    document.getElementById('fileList').innerHTML = '<p style="color: red;">Failed to load files.</p>';
                });
           }

           // Download and decrypt a file
           async function downloadFile(fileId, filename) {
                const key = await CryptoUtils.loadKey();
                if (!key) {
                    alert('Encryption key not found. Please log in again.');
                    window.location.href = 'index.html';
                    return;
                }

                fetch(window.API_CONFIG.API_URL + "/api/download/" + fileId, {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                })
                .then(response => {
                    if (!response.ok) throw new Error('Download failed');
                    return response.blob();
                })
                .then(async blob => {
                    const decrypted = await CryptoUtils.decryptFile(blob, key);
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(new Blob([decrypted]));
                    a.download = filename;
                    a.click();
                    URL.revokeObjectURL(a.href);
                })
                .catch(error => {
                    console.error('Error downloading file:', error);
                    alert('Failed to download or decrypt file.');
                });
           }

           // Revoke a file
           function revokeFile(fileId) {
                if (!confirm('Are you sure you want to revoke this file? It will no longer be accessible.')) return;

                fetch(window.API_CONFIG.API_URL + "/api/files/" + fileId + "/revoke", {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}` }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('File revoked successfully.');
                        listFiles();
                    } else {
                        alert('Revoke failed: ' + (data.detail || 'Unknown error'));
                    }
                })
                .catch(error => {
                    console.error('Error revoking file:', error);
                    alert('Failed to revoke file.');
                });
           }
        </script>
    </body>
</html>
