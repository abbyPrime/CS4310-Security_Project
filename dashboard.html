<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>CinemaShare Dashboard</title>
        <link rel="stylesheet" href="dashboard.css">
        <script src="config.js"></script>
        <script src="crypto.js"></script>
    </head>
    <body>
        <header class="navbar">
            <h1 class="logo">CinemaShare</h1>
            
            <div class="profile-menu">
                <button class="profile-button">👤</button>

                <div class="dropdown">
                    <a href="#">Profile</a>
                    <a href="#">Settings</a>
                    <a href="index.html">Logout</a>
                </div>
            </div>
        </header>

            <div class="container">
                <h2>Dashboard</h2>
                <p>Welcome to your CinemaShare dashboard!</p>
                <p id="roleDisplay"></p>

                <div class="card">
                    <h3>File Upload</h3>
                    <input type="file" id="fileInput" />
                    <button onclick="uploadFile()">Upload Screenplay</button>
                    <button onclick="listFiles()">View Uploaded Files</button>
                </div>
                
                <div class="file-row" onclick="openFile('script.pdf')">
                    <span class="file-name">script.pdf</span>
                    <span class="file-meta">200KB</span>
                </div>

                <div class="file-row" onclick="openFile('script2.pdf')">
                    <span class="file-name">script2.pdf</span>
                    <span class="file-meta">140KB</span>
                </div>

                <div id="fileList" style="margin-top: 20px;"></div>

                <div class="card" id="screenplayUploadCard">
                    <h3>Upload Screenplay (.txt, line-based)</h3>
                    <input type="file" id="screenplayInput" accept=".txt" />
                    <button onclick="uploadScreenplay()">Upload Screenplay</button>
                </div>

                <div id="screenplayViewer" style="display:none; margin-top:20px; border-top:2px solid #ccc; padding-top:15px;">
                    <h4 id="viewerTitle"></h4>
                    <button onclick="closeViewer()">Close</button>
                    <div id="viewerLines" style="font-family:monospace; margin-top:10px; max-height:500px; overflow-y:auto;"></div>
                    <button id="savePermBtn" style="display:none; margin-top:10px;" onclick="savePermissions()">Save Permissions</button>
                </div>
            </div>

        <script>
            // Check if user is authenticated
            let token = localStorage.getItem('access_token');

            if (!token && window.location.protocol === 'file:') {
                console.warn("DEV MODE: Allowing local access");
                token = "dev-token";

                localStorage.setItem('access_token', token);
                localStorage.setItem('role', 'producer');
            }

            if (!token) {
                //Redirect to login if no token found
                window.location.href = 'index.html';
            }

            // Decode role from JWT
            function getRoleFromToken(t) {
                try { return JSON.parse(atob(t.split('.')[1])).role || 'viewer'; }
                catch { return 'viewer'; }
            }
            const role = getRoleFromToken(token);

            function applyRBAC() {
                const uploadCard = document.querySelector('.card');
                const fileUploadTitle = uploadCard.querySelector('h3');

                // Actors will NOT be allowed to upload files
                if (role === 'actor') {
                    uploadCard.style.display = 'none';
                }

                if (role === 'producer') {
                    fileUploadTitle.textContent = 'Manage Scripts';
                }

                if (role === 'screenwriter') {
                    fileUploadTitle.textContent = 'Upload Script';
                }
            }

        window.addEventListener('DOMContentLoaded', () => {
            applyRBAC();
            document.getElementById('roleDisplay').textContent = `Role ${role}`;
        });

            // Dropdown menu functionality
            const profileButton = document.querySelector('.profile-button');
            const dropdown = document.querySelector('.dropdown');

            profileButton.addEventListener('click', () => {
                dropdown.classList.toggle('show');
            });

            // Close the dropdown if the user clicks outside of it
            window.addEventListener('click', (event) => {
                if (!event.target.matches('.profile-button') && !event.target.matches('.profile-icon')) {
                    if (dropdown.classList.contains('show')) {
                        dropdown.classList.remove('show');
                    }
                }
            });

            // Handle logout
            const logoutLink = document.querySelector('.dropdown a[href="index.html"]');
            logoutLink.addEventListener('click', (event) => {
                event.preventDefault();
                // Clear the token
                localStorage.removeItem('access_token');
                // Redirect to login
                window.location.href = 'index.html';
            });

            // Handle file upload with AES-GCM encryption
           async function uploadFile() {
                if (role === 'actor') {
                    alert('Actors are not allowed to upload scripts.');
                    return;
                }

                const fileInput = document.getElementById('fileInput');
                const file = fileInput.files[0];
                if (!file) {
                    alert('Please select a file to upload.');
                    return;
                }

                const key = await CryptoUtils.loadKey();
                if (!key) {
                    alert('Encryption key not found. Please log in again.');
                    window.location.href = 'index.html';
                    return;
                }

                const encryptedBlob = await CryptoUtils.encryptFile(file, key);
                const encryptedFile = new File([encryptedBlob], file.name, { type: 'application/octet-stream' });

                const formData = new FormData();
                formData.append('file', encryptedFile);

                fetch(window.API_CONFIG.API_URL + "/api/upload", {
                    method: 'POST',
                    body: formData,
                    headers: { 'Authorization': `Bearer ${token}` }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('File uploaded and encrypted successfully!');
                        listFiles();
                    } else {
                        alert('Upload failed: ' + (data.detail || 'Unknown error'));
                    }
                })
                .catch(error => {
                    console.error('Error uploading file:', error);
                    alert('Failed to upload file.');
                });
           }

           // List all uploaded files
           function listFiles() {
                fetch(window.API_CONFIG.API_URL + "/api/uploads", {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                })
                .then(response => response.json())
                .then(data => {
                    const fileListDiv = document.getElementById('fileList');
                    if (data.success && data.files.length > 0) {
                        let html = '<h4>Uploaded Files (' + data.total + '):</h4><ul>';
                        data.files.forEach(file => {
                            const sizeKB = (file.size / 1024).toFixed(2);
                            const uploadedAt = file.uploaded_at ? new Date(file.uploaded_at).toLocaleString() : '';
                            html += `<li>
                                <strong>${file.filename}</strong> - ${sizeKB} KB (${uploadedAt})
                                <button onclick="downloadFile(${file.file_id}, '${file.filename}')" style="margin-left: 10px;">Download</button>
                                <button onclick="viewScreenplay(${file.file_id}, '${file.filename}')" style="margin-left: 5px;">View</button>
                                <button onclick="revokeFile(${file.file_id})" style="margin-left: 5px; color: red;">Revoke</button>
                            </li>`;
                        });
                        html += '</ul>';
                        fileListDiv.innerHTML = html;
                    } else {
                        fileListDiv.innerHTML = '<p>No files uploaded yet.</p>';
                    }
                })
                .catch(error => {
                    console.error('Error listing files:', error);
                    document.getElementById('fileList').innerHTML = '<p style="color: red;">Failed to load files.</p>';
                });
           }

           // Download and decrypt a file
           async function downloadFile(fileId, filename) {
                const key = await CryptoUtils.loadKey();
                if (!key) {
                    alert('Encryption key not found. Please log in again.');
                    window.location.href = 'index.html';
                    return;
                }

                fetch(window.API_CONFIG.API_URL + "/api/download/" + fileId, {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                })
                .then(response => {
                    if (!response.ok) throw new Error('Download failed');
                    return response.blob();
                })
                .then(async blob => {
                    const decrypted = await CryptoUtils.decryptFile(blob, key);
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(new Blob([decrypted]));
                    a.download = filename;
                    a.click();
                    URL.revokeObjectURL(a.href);
                })
                .catch(error => {
                    console.error('Error downloading file:', error);
                    alert('Failed to download or decrypt file.');
                });
           }

           // Upload screenplay (line-based, no encryption)
           async function uploadScreenplay() {
                const fileInput = document.getElementById('screenplayInput');
                const file = fileInput.files[0];
                if (!file) { alert('Please select a .txt file.'); return; }

                const formData = new FormData();
                formData.append('file', file);

                fetch(window.API_CONFIG.API_URL + "/api/upload-screenplay", {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        alert(`Screenplay uploaded! ${data.line_count} lines stored.`);
                        listFiles();
                    } else {
                        alert('Upload failed: ' + (data.detail || 'Unknown error'));
                    }
                })
                .catch(() => alert('Failed to upload screenplay.'));
           }

           // View screenplay lines (filtered by role)
           const ROLES = ['actor', 'screenwriter', 'director'];
           let currentViewFileId = null;

           async function viewScreenplay(fileId, filename) {
                currentViewFileId = fileId;
                document.getElementById('viewerTitle').textContent = 'Screenplay: ' + filename;
                document.getElementById('screenplayViewer').style.display = 'block';
                document.getElementById('savePermBtn').style.display = role === 'producer' ? 'inline-block' : 'none';
                document.getElementById('viewerLines').innerHTML = 'Loading...';

                fetch(window.API_CONFIG.API_URL + "/api/files/" + fileId + "/view", {
                    headers: { 'Authorization': `Bearer ${token}` }
                })
                .then(r => r.json())
                .then(data => {
                    if (!data.success) { document.getElementById('viewerLines').innerHTML = '<p>Not a screenplay file.</p>'; return; }

                    if (role === 'producer') {
                        // Table layout with column-select headers
                        let html = `<table style="width:100%; border-collapse:collapse; font-family:monospace; font-size:0.9em;">
                            <thead>
                                <tr style="background:#333; color:#fff; position:sticky; top:0;">
                                    <th style="width:40px; padding:6px;">#</th>
                                    <th style="text-align:left; padding:6px;">Content</th>
                                    ${ROLES.map(r => `
                                    <th style="width:100px; padding:6px; text-align:center;">
                                        ${r}<br>
                                        <label style="font-size:0.8em; font-weight:normal; cursor:pointer;">
                                            <input type="checkbox" id="selectAll_${r}" onchange="toggleAllRole('${r}', this.checked)" checked>
                                            all
                                        </label>
                                    </th>`).join('')}
                                </tr>
                            </thead>
                            <tbody>`;

                        data.lines.forEach((line, i) => {
                            const checked = (r) => line.allowed_roles.length === 0 || line.allowed_roles.includes(r);
                            const bg = i % 2 === 0 ? '#1a1a1a' : '#222';
                            html += `<tr style="background:${bg};">
                                <td style="padding:4px 6px; color:#666; text-align:center;">${line.line_number}</td>
                                <td style="padding:4px 6px;">${line.content || '&nbsp;'}</td>
                                ${ROLES.map(r => `
                                <td style="text-align:center; padding:4px;">
                                    <input type="checkbox" class="perm-check" data-line="${line.line_id}" data-role="${r}" ${checked(r) ? 'checked' : ''}>
                                </td>`).join('')}
                            </tr>`;
                        });

                        html += '</tbody></table>';
                        document.getElementById('viewerLines').innerHTML = html;

                        // Sync "all" header checkboxes on initial render
                        ROLES.forEach(r => syncHeaderCheck(r));
                    } else {
                        // Non-producer: plain view with [REDACTED]
                        let html = '<table style="width:100%; border-collapse:collapse; font-family:monospace; font-size:0.9em;">';
                        data.lines.forEach((line, i) => {
                            const bg = !line.visible ? '#3a0000' : (i % 2 === 0 ? '#1a1a1a' : '#222');
                            const color = !line.visible ? '#888' : 'inherit';
                            html += `<tr style="background:${bg}; color:${color};">
                                <td style="padding:4px 6px; color:#555; width:40px; text-align:center;">${line.line_number}</td>
                                <td style="padding:4px 6px;">${line.content}</td>
                            </tr>`;
                        });
                        html += '</table>';
                        document.getElementById('viewerLines').innerHTML = html;
                    }
                })
                .catch(() => { document.getElementById('viewerLines').innerHTML = '<p style="color:red;">Failed to load screenplay.</p>'; });
           }

           function toggleAllRole(roleName, checked) {
                document.querySelectorAll(`.perm-check[data-role="${roleName}"]`)
                    .forEach(cb => cb.checked = checked);
           }

           function syncHeaderCheck(roleName) {
                const all = [...document.querySelectorAll(`.perm-check[data-role="${roleName}"]`)];
                const header = document.getElementById(`selectAll_${roleName}`);
                if (header) header.checked = all.every(cb => cb.checked);
           }

           async function savePermissions() {
                const checks = document.querySelectorAll('.perm-check');
                const linePerms = {};
                checks.forEach(cb => {
                    const lid = cb.dataset.line;
                    if (!linePerms[lid]) linePerms[lid] = [];
                    if (cb.checked) linePerms[lid].push(cb.dataset.role);
                });
                const permissions = Object.entries(linePerms).map(([line_id, roles]) => ({
                    line_id: parseInt(line_id), roles
                }));

                fetch(window.API_CONFIG.API_URL + "/api/files/" + currentViewFileId + "/permissions", {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ permissions })
                })
                .then(r => r.json())
                .then(data => {
                    if (data.success) alert('Permissions saved!');
                    else alert('Failed: ' + (data.detail || 'Unknown'));
                })
                .catch(() => alert('Failed to save permissions.'));
           }

           function closeViewer() {
                document.getElementById('screenplayViewer').style.display = 'none';
                currentViewFileId = null;
           }

           // Revoke a file
           function revokeFile(fileId) {
                if (!confirm('Are you sure you want to revoke this file? It will no longer be accessible.')) return;

                fetch(window.API_CONFIG.API_URL + "/api/files/" + fileId + "/revoke", {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}` }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('File revoked successfully.');
                        listFiles();
                    } else {
                        alert('Revoke failed: ' + (data.detail || 'Unknown error'));
                    }
                })
                .catch(error => {
                    console.error('Error revoking file:', error);
                    alert('Failed to revoke file.');
                });
           }
        </script>
    </body>
</html>
